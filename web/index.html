<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchtower API Made Easy</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.4;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      form {
        display: grid;
        gap: 0.75rem;
      }
      label {
        display: grid;
        gap: 0.25rem;
        font-weight: 600;
      }
      input, select, textarea, button {
        font: inherit;
        padding: 0.5rem;
      }
      textarea {
        min-height: 120px;
      }
      pre {
        background: #111827;
        color: #f9fafb;
        padding: 1rem;
        border-radius: 6px;
        overflow: auto;
      }
      .hint {
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <h1>Watchtower API tester</h1>
    <p class="hint">Use this page to build and send API requests through the local proxy.</p>

    <form id="requestForm">
      <label>
        Base URL
        <input id="baseUrl" type="url" required value="http://localhost:8000" />
      </label>

      <label>
        Endpoint path
        <input id="endpoint" type="text" required value="/api/v1/health" />
      </label>

      <label>
        Method
        <select id="method">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>PATCH</option>
          <option>DELETE</option>
        </select>
      </label>

      <label>
        Headers (JSON object)
        <textarea id="headers">{}</textarea>
      </label>

      <label>
        Body (raw text)
        <textarea id="body"></textarea>
      </label>

      <button type="submit">Send request</button>
    </form>

    <h2>Response</h2>
    <pre id="response">No request yet.</pre>

    <script>
      const form = document.getElementById('requestForm');
      const responsePanel = document.getElementById('response');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        responsePanel.textContent = 'Loading...';

        let headers;
        try {
          headers = JSON.parse(document.getElementById('headers').value || '{}');
        } catch (error) {
          responsePanel.textContent = `Invalid headers JSON: ${error.message}`;
          return;
        }

        const payload = {
          baseUrl: document.getElementById('baseUrl').value,
          endpoint: document.getElementById('endpoint').value,
          method: document.getElementById('method').value,
          headers,
          body: document.getElementById('body').value
        };

        try {
          const res = await fetch('/api/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          responsePanel.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          responsePanel.textContent = `Request failed: ${error.message}`;
        }
      });
    </script>
  </body>
  </html>
